[project]
name = "synapse-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "synapse-core",
    "synapse-matching",
    "synapse-reporting",
    "synapse-backend",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.5.0",
    "pot>=0.9.7.post1",
    "lxml>=6.1.2",
    "reportlab>=5.0.1",
    "svglib>=2.2.0",
    "pytest>=9.1.1",
    "httpx2>=2.12.0",
    "openpyxl>=3.1.5",
    "python-calamine>=0.8.2",
    "fsspec>=2026.7.0",
    "fastexcel>=0.21.0",
]

[tool.uv.sources]
synapse-core = { workspace = true }
synapse-matching = { workspace = true }
synapse-reporting = { workspace = true }
synapse-backend = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/synapse-core",
    "packages/synapse-matching",
    "packages/synapse-reporting",
    "packages/synapse-gui/backend",
]
