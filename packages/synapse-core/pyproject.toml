[project]
name = "synapse-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_core"]
