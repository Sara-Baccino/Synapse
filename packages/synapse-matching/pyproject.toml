[project]
name = "synapse-matching"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "synapse-core",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
]

[tool.uv.sources]
synapse-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_matching"]
