[project]
name = "synapse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
    "scipy>=1.12.0",
    "pydantic>=2.0.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "synapse-core",
    "synapse-matching",
    "synapse-reporting",
]

[tool.uv.sources]
synapse-core = { workspace = true }
synapse-matching = { workspace = true }
synapse-reporting = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synapse_gui"]
