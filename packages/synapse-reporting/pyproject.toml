[project]
name = "synapse-reporting"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "synapse-core",
    "polars>=0.20.0",
    "matplotlib>=3.8.0",
]

[tool.uv.sources]
synapse-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_reporting"]
